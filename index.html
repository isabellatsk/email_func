<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionalidade de Email</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="email-section">
        <div class="email-container">
            <h2>Lista de Contatos</h2>
            <table id="tabela">
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Selecionar</th>
                </tr>
                <tr>
                    <td>Yuri</td>
                    <td>3700000635@sinodalprado.com.br</td>
                    <td><input type="checkbox" class="checkbox" value="3700000635@sinodalprado.com.br"></td>
                </tr>
                <tr>
                    <td>Isa</td>
                    <td>3700000636@sinodalprado.com.br</td>
                    <td><input type="checkbox" class="checkbox" value="3700000636@sinodalprado.com.br"></td>
                </tr>
                <tr>
                    <td>Bruno</td>
                    <td>3700000645@sinodalprado.com.br</td>
                    <td><input type="checkbox" class="checkbox" value="3700000645@sinodalprado.com.br"></td>
                </tr>
            </table>
            <button onclick="enviarEmail()">Enviar Email</button>
            <button onclick="mostrarFormulario()">Adicionar Pessoa</button>
        </div>
    </section>

    <div class="form-container" id="formContainer">
        <button class="close" onclick="fecharFormulario()">X</button>
        <h2>Adicionar Pessoa</h2>
        <form onsubmit="adicionar(event)">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" required>
            
            <button type="submit">Adicionar</button>
        </form>
    </div>

    <script>
        function enviarEmail() {
            const emailsSelecionados = [...document.querySelectorAll('.checkbox:checked')].map(checkbox => checkbox.value);
            
            if (emailsSelecionados.length) {
                const mailtoUrl = `mailto:${emailsSelecionados.join(',')}`;
                window.open(mailtoUrl, '_blank');
            } else {
                alert('Selecione no mínimo um e-mail.');
            }
        }

        function mostrarFormulario() {
            document.getElementById('formContainer').style.display='flex';
        }

        function fecharFormulario() {
            document.getElementById('formContainer').style.display='none';
        }

        function adicionar(event) {
            event.preventDefault(); 
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            
            if (nome && email) {
                const tabela = document.getElementById('tabela');
                const novaLinha = tabela.insertRow();
                
                const celulaNome = novaLinha.insertCell(0);
                const celulaEmail = novaLinha.insertCell(1);
                const celulaCheckbox = novaLinha.insertCell(2);
                
                celulaNome.textContent = nome;
                celulaEmail.textContent = email;
                celulaCheckbox.innerHTML = `<input type="checkbox" class="checkbox" value="${email}">`;
                
                document.getElementById('nome').value = '';
                document.getElementById('email').value = '';
                fecharFormulario(); 
            } else {
                alert('Preencha todos os campos.');
            }
        }
    </script>
</body>
</html>
